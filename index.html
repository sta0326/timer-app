<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>タイマー</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg: #EFEFEF;
    --panel: #FFFFFF;
    --ink: #1A1A1A;
    --sub: #555555;
    --bar-on: #1E5AA8;
    --bar-off: #FFFFFF;
    --bar-border: #B0B0B0;
    --bar-border-off: #FFFFFF;
    --accent: #D6480F;
    --safe: #1E8A4C;
    --focus: #D6480F;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    height:100%;
    background: var(--bg);
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    user-select: none;
  }

  .app{
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 32px;
    gap: 20px;
  }

  .setup{
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border-radius: 20px;
    padding: 22px 20px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .setup-title{
    font-size: 20px;
    font-weight: 700;
    text-align: center;
  }

  .setup-display{
    font-size: clamp(48px, 14vw, 90px);
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--bar-on);
  }

  .hidden{ display:none !important; }

  .setup-hint{
    font-size: 14px;
    color: var(--sub);
    text-align: center;
  }

  .picker-row{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    position: relative;
  }

  .picker-col{
    position: relative;
    height: 168px;
    width: 110px;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .picker-col::-webkit-scrollbar{ display:none; }

  .picker-pad{
    height: 56px;
    scroll-snap-align: none;
  }

  .picker-item{
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #B8B8B8;
    scroll-snap-align: center;
  }
  .picker-item.selected{
    color: var(--bar-on);
  }

  .picker-unit{
    font-size: 16px;
    color: var(--sub);
    text-align: center;
    margin-top: 4px;
  }

  .picker-selection-frame{
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    height: 56px;
    border-top: 2px solid var(--bar-on);
    border-bottom: 2px solid var(--bar-on);
    pointer-events: none;
  }

  .picker-cols-wrap{
    position: relative;
    display: flex;
    justify-content: center;
    gap: 4px;
  }

  #beginBtn{
    align-self: center;
    margin-top: 4px;
    background: #0B3D91;
    font-size: 24px;
    padding: 18px 40px;
  }

  .clock{
    font-size: clamp(56px, 16vw, 120px);
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #FFFFFF;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .clock.warn{ color: var(--accent); }
  .clock.done{ color: var(--safe); }

  .subtext{
    font-size: clamp(16px, 4vw, 22px);
    color: var(--sub);
    text-align: center;
    min-height: 1.4em;
  }

  .bars-wrap{
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.06);
  }

  .bars{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-flow: row;
    gap: 12px;
  }

  @media (min-width: 480px){
    .bars{ grid-template-columns: repeat(10, 1fr); }
  }

  .bar{
    position: relative;
    height: 46px;
    border-radius: 10px;
    background: var(--bar-off);
    border: 1px solid var(--bar-border);
    overflow: hidden;
    transition: border-color 0.4s ease;
  }

  .bar.off{
    border-color: var(--bar-border-off);
  }

  .bar-fill{
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 100%;
    background: var(--bar-on);
    transform-origin: right center;
    transform: scaleX(1);
  }

  .bar.off .bar-fill{
    transform: scaleX(0);
    background: var(--bar-off);
  }

  .controls{
    display: flex;
    gap: 14px;
    margin-top: 4px;
  }

  button{
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 11px 22px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    color: #fff;
    min-width: 96px;
    touch-action: manipulation;
    opacity: 0.88;
  }

  button:focus-visible{
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  #startBtn{ background: var(--bar-on); }
  #startBtn:disabled{ background: #A9B7C4; cursor: default; }

  #pauseBtn{ background: var(--accent); }
  #pauseBtn:disabled{ background: #E8B79A; cursor: default; }

  #resetBtn{ background: #4A4A4A; }

  .done-overlay{
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 50;
  }
  .done-overlay.show{
    opacity: 1;
    pointer-events: auto;
  }

  .done-icon{
    width: min(60vw, 260px);
    height: min(60vw, 260px);
    animation: popIn 0.5s ease;
  }

  @keyframes popIn{
    0%{ transform: scale(0.4); opacity: 0; }
    60%{ transform: scale(1.08); opacity: 1; }
    100%{ transform: scale(1); opacity: 1; }
  }

  #doneOkBtn{
    background: var(--safe);
    margin-top: 8px;
  }

  @media (prefers-reduced-motion: reduce){
    .bar, .done-overlay, .done-icon{ transition: none; animation: none; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="setup" id="setupPanel">
    <div class="setup-title">じかんを えらんでね</div>
    <div class="setup-display" id="setupDisplay">5:00</div>

    <div class="picker-cols-wrap">
      <div class="picker-selection-frame"></div>
      <div class="picker-col" id="minCol">
        <div class="picker-pad"></div>
        <div class="picker-pad"></div>
      </div>
      <div class="picker-col" id="secCol">
        <div class="picker-pad"></div>
        <div class="picker-pad"></div>
      </div>
    </div>
    <div class="picker-unit">ふん　　　びょう</div>

    <div class="setup-hint">スクロールして じかんを えらんでね</div>
    <button id="beginBtn">はじめる</button>
  </div>

  <div id="runPanel" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:20px;">
    <div class="clock" id="clock" aria-live="polite">5:00</div>
    <div class="subtext" id="subtext">スタートを おしてね</div>

    <div class="bars-wrap">
      <div class="bars" id="bars"></div>
    </div>

    <div class="controls">
      <button id="startBtn">スタート</button>
      <button id="pauseBtn" disabled>とめる</button>
      <button id="resetBtn">もどす</button>
    </div>

    <button id="changeTimeBtn" style="background:#8A8A8A; margin-top:-6px;">じかんを かえる</button>
  </div>

</div>

<div class="done-overlay" id="doneOverlay">
  <svg class="done-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="92" fill="#1E8A4C"/>
    <circle cx="100" cy="100" r="92" fill="none" stroke="#166B3A" stroke-width="6"/>
    <circle cx="68" cy="85" r="10" fill="#FFFFFF"/>
    <circle cx="132" cy="85" r="10" fill="#FFFFFF"/>
    <path d="M 55 120 Q 100 165 145 120" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"/>
  </svg>
  <button id="doneOkBtn">できたよ</button>
</div>

    Array.from(col.querySelectorAll('.picker-item')).forEach(el => el.remove());
    const endPad = col.lastElementChild;
    values.forEach(v=>{

      item.className = 'picker-item';
      item.textContent = formatFn(v);
      item.dataset.value = v;
      col.insertBefore(item, endPad);
    });
  }

  buildPickerItems(minCol, Array.from({length: MIN_OPTIONS+1}, (_,i)=>i), v=>String(v));
  buildPickerItems(secCol, SEC_OPTIONS, v=>String(v).padStart(2,'0'));

  function formatSetupTime(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2,'0');
  }

  function clampTotalSeconds(sec){
    return Math.max(MIN_SECONDS, Math.min(MAX_SECONDS, sec));
  }

  function getSelectedValue(col){
    const idx = Math.round(col.scrollTop / ITEM_H);
    const items = col.querySelectorAll('.picker-item');
    const clampedIdx = Math.max(0, Math.min(items.length-1, idx));
    return { idx: clampedIdx, value: Number(items[clampedIdx].dataset.value) };
  }

  function updateSelectedHighlight(col, selectedIdx){
    col.querySelectorAll('.picker-item').forEach((el, i)=>{
      el.classList.toggle('selected', i === selectedIdx);
    });
  }

  function recalcTotalFromPickers(){
    const m = getSelectedValue(minCol);
    const s = getSelectedValue(secCol);
    updateSelectedHighlight(minCol, m.idx);
    updateSelectedHighlight(secCol, s.idx);
    let total = m.value*60 + s.value;
    if(total < MIN_SECONDS) total = MIN_SECONDS;
    if(total > MAX_SECONDS) total = MAX_SECONDS;
    TOTAL_SECONDS = total;
    setupDisplay.textContent = formatSetupTime(TOTAL_SECONDS);
  }

  let scrollDebounce = {min:null, sec:null};
  function onColScroll(col, key){
    if(scrollDebounce[key]) clearTimeout(scrollDebounce[key]);
    scrollDebounce[key] = setTimeout(()=>{
      recalcTotalFromPickers();
    }, 80);
  }
  minCol.addEventListener('scroll', ()=>onColScroll(minCol,'min'));
  secCol.addEventListener('scroll', ()=>onColScroll(secCol,'sec'));

  function setPickerToSeconds(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    const minIdx = Math.max(0, Math.min(MIN_OPTIONS, m));
    const secIdx = Math.max(0, SEC_OPTIONS.indexOf(Math.round(s/10)*10));
    minCol.scrollTop = minIdx * ITEM_H;
    secCol.scrollTop = (secIdx < 0 ? 0 : secIdx) * ITEM_H;
    updateSelectedHighlight(minCol, minIdx);
    updateSelectedHighlight(secCol, secIdx < 0 ? 0 : secIdx);
  }

  setTimeout(()=>{ setPickerToSeconds(TOTAL_SECONDS); setupDisplay.textContent = formatSetupTime(TOTAL_SECONDS); }, 0);

    setupPanel.classList.remove('hidden');

  });
