<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>タイマー</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    color-scheme: light;
    --bg: #EFEFEF;
    --panel: #FFFFFF;
    --ink: #1A1A1A;
    --sub: #555555;
    --bar-on: #1E5AA8;
    --bar-off: #FFFFFF;
    --bar-border: #B0B0B0;
    --bar-border-off: #FFFFFF;
    --accent: #D6480F;
    --safe: #1E8A4C;
    --focus: #D6480F;
  }

*{ box-sizing: border-box; }

html, body{
margin:0; padding:0;
height:100%;
background: var(–bg);
font-family: “Hiragino Maru Gothic ProN”, “BIZ UDGothic”, “Yu Gothic”, sans-serif;
color: var(–ink);
-webkit-tap-highlight-color: transparent;
overscroll-behavior: none;
user-select: none;
}

.app{
min-height: 100dvh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
padding: 24px 16px 32px;
gap: 20px;
}

/* –– 設定パネル –– */
.setup{
width: 100%;
max-width: 640px;
background: var(–panel);
border-radius: 20px;
padding: 22px 20px;
box-shadow: 0 2px 14px rgba(0,0,0,0.06);
display: flex;
flex-direction: column;
gap: 18px;
}

.setup-title{
font-size: 20px;
font-weight: 700;
text-align: center;
}

.setup-display{
font-size: clamp(48px, 14vw, 90px);
font-weight: 700;
text-align: center;
font-variant-numeric: tabular-nums;
color: var(–bar-on);
}

.hidden{ display:none !important; }

.setup-hint{
font-size: 14px;
color: var(–sub);
text-align: center;
}

/* –– スクロールピッカー –– */
.picker-row{
display: flex;
justify-content: center;
align-items: center;
gap: 4px;
position: relative;
}

.picker-col{
position: relative;
height: 168px; /* 3項目分表示 (56px x 3) */
width: 110px;
overflow-y: scroll;
scroll-snap-type: y mandatory;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
background: #FFFFFF;
}
.picker-col::-webkit-scrollbar{ display:none; }

.picker-pad{
height: 56px; /* 上下の余白 = (168-56)/2 */
scroll-snap-align: none;
}

.picker-item{
height: 56px;
display: flex;
align-items: center;
justify-content: center;
font-size: 34px;
font-weight: 700;
font-variant-numeric: tabular-nums;
color: #8A8A8A;
scroll-snap-align: center;
}
.picker-item.selected{
color: var(–bar-on);
}

.picker-unit{
font-size: 16px;
color: var(–sub);
text-align: center;
margin-top: 4px;
}

.picker-selection-frame{
position: absolute;
top: 56px;
left: 0;
right: 0;
height: 56px;
border-top: 2px solid var(–bar-on);
border-bottom: 2px solid var(–bar-on);
pointer-events: none;
}

.picker-cols-wrap{
position: relative;
display: flex;
justify-content: center;
gap: 4px;
}

#beginBtn{
align-self: center;
margin-top: 4px;
background: #0B3D91;
font-size: 24px;
padding: 18px 40px;
}

/* –– 実行画面 –– */
.clock{
font-size: clamp(56px, 16vw, 120px);
font-weight: 700;
letter-spacing: 0.02em;
color: var(–ink);
line-height: 1;
font-variant-numeric: tabular-nums;
text-align: center;
}

.clock.warn{ color: var(–accent); }
.clock.done{ color: var(–safe); }

.subtext{
font-size: clamp(16px, 4vw, 22px);
color: var(–sub);
text-align: center;
min-height: 1.4em;
}

.bars-wrap{
width: 100%;
max-width: 900px;
background: var(–panel);
border-radius: 20px;
padding: 28px 24px;
box-shadow: 0 2px 14px rgba(0,0,0,0.06);
}

.bars{
display: grid;
grid-template-columns: repeat(6, 1fr);
grid-auto-flow: row;
gap: 12px;
}

@media (min-width: 480px){
.bars{ grid-template-columns: repeat(10, 1fr); }
}

.bar{
position: relative;
height: 46px;
border-radius: 10px;
background: var(–bar-off);
border: 1px solid var(–bar-border);
overflow: hidden;
transition: border-color 0.4s ease;
}

.bar.off{
border-color: var(–bar-border-off);
}

.bar-fill{
position: absolute;
top: 0; left: 0; bottom: 0;
width: 100%;
background: var(–bar-on);
transform-origin: right center;
transform: scaleX(1);
}

.bar.off .bar-fill{
transform: scaleX(0);
background: var(–bar-off);
}

.controls{
display: flex;
gap: 14px;
margin-top: 4px;
}

button{
font-family: inherit;
font-size: 16px;
font-weight: 700;
padding: 11px 22px;
border-radius: 14px;
border: none;
cursor: pointer;
color: #fff;
min-width: 96px;
touch-action: manipulation;
opacity: 0.88;
}

button:focus-visible{
outline: 3px solid var(–focus);
outline-offset: 2px;
}

#startBtn{ background: var(–bar-on); }
#startBtn:disabled{ background: #A9B7C4; cursor: default; }

#pauseBtn{ background: var(–accent); }
#pauseBtn:disabled{ background: #E8B79A; cursor: default; }

#resetBtn{ background: #4A4A4A; }

.done-overlay{
position: fixed;
inset: 0;
background: rgba(255,255,255,0.97);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 12px;
opacity: 0;
pointer-events: none;
transition: opacity 0.4s ease;
z-index: 50;
}
.done-overlay.show{
opacity: 1;
pointer-events: auto;
}

.done-icon{
width: min(60vw, 260px);
height: min(60vw, 260px);
animation: popIn 0.5s ease;
}

@keyframes popIn{
0%{ transform: scale(0.4); opacity: 0; }
60%{ transform: scale(1.08); opacity: 1; }
100%{ transform: scale(1); opacity: 1; }
}

#doneOkBtn{
background: var(–safe);
margin-top: 8px;
}

@media (prefers-reduced-motion: reduce){
.bar, .done-overlay, .done-icon{ transition: none; animation: none; }
}
</style>

</head>
<body>
<div class="app">

  <!-- 設定画面 -->

  <div class="setup" id="setupPanel">
    <div class="setup-title">じかんを えらんでね</div>
    <div class="setup-display" id="setupDisplay">5:00</div>

  <div class="picker-selection-frame"></div>
  <div class="picker-col" id="minCol">
    <div class="picker-pad"></div>
    <!-- items injected by JS -->
    <div class="picker-pad"></div>
  </div>
  <div class="picker-col" id="secCol">
    <div class="picker-pad"></div>
    <!-- items injected by JS -->
    <div class="picker-pad"></div>
  </div>
</div>
<div class="picker-unit">ふん　　　びょう</div>

<div class="setup-hint">スクロールして じかんを えらんでね</div>
<button id="beginBtn">はじめる</button>
```

  </div>

  <!-- 実行画面 -->

  <div id="runPanel" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:20px;">
    <div class="clock" id="clock" aria-live="polite">5:00</div>
    <div class="subtext" id="subtext">スタートを おしてね</div>

```
<div class="bars-wrap">
  <div class="bars" id="bars"></div>
</div>

<div class="controls">
  <button id="startBtn">スタート</button>
  <button id="pauseBtn" disabled>とめる</button>
  <button id="resetBtn">もどす</button>
</div>

<button id="changeTimeBtn" style="background:#8A8A8A; margin-top:-6px;">じかんを かえる</button>
<div id="debugInfo" style="font-size:12px; color:red; text-align:center;"></div>
```

  </div>

</div>

<!-- 終了オーバーレイ(文字が読めなくても分かる絵) -->

<div class="done-overlay" id="doneOverlay">
  <svg class="done-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="92" fill="#1E8A4C"/>
    <circle cx="100" cy="100" r="92" fill="none" stroke="#166B3A" stroke-width="6"/>
    <!-- にっこり顔 -->
    <circle cx="68" cy="85" r="10" fill="#FFFFFF"/>
    <circle cx="132" cy="85" r="10" fill="#FFFFFF"/>
    <path d="M 55 120 Q 100 165 145 120" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"/>
  </svg>
  <button id="doneOkBtn">できたよ</button>
</div>

<script>
(function(){
  const SECONDS_PER_BAR = 10;
  const MIN_SECONDS = 10;
  const MAX_SECONDS = 600; // 10分

  let TOTAL_SECONDS = 300; // 初期値 5分
  let TOTAL_BARS = TOTAL_SECONDS / SECONDS_PER_BAR;

  // ---- 要素取得 ----
  const setupPanel = document.getElementById('setupPanel');
  const setupDisplay = document.getElementById('setupDisplay');
  const minCol = document.getElementById('minCol');
  const secCol = document.getElementById('secCol');
  const beginBtn = document.getElementById('beginBtn');

  const runPanel = document.getElementById('runPanel');
  const barsEl = document.getElementById('bars');
  const clockEl = document.getElementById('clock');
  const subtextEl = document.getElementById('subtext');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const doneOverlay = document.getElementById('doneOverlay');
  const doneOkBtn = document.getElementById('doneOkBtn');
  const changeTimeBtn = document.getElementById('changeTimeBtn');

  let running = false;
  let audioCtx = null;
  let barEls = [];
  let fillEls = [];
  let startTimestamp = null;
  let elapsedBeforePause = 0;
  let rafId = null;

  // ---- 設定画面（スクロールピッカー） ----
  const ITEM_H = 56;
  const MIN_OPTIONS = 10; // 0〜10分
  const SEC_OPTIONS = [0,10,20,30,40,50];

  function buildPickerItems(col, values, formatFn){
    // 既存のitemを削除(padは残す)
    Array.from(col.querySelectorAll('.picker-item')).forEach(el => el.remove());
    const endPad = col.lastElementChild; // 末尾のpad
    values.forEach(v=>{
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.textContent = formatFn(v);
      item.dataset.value = v;
      col.insertBefore(item, endPad);
    });
  }

  buildPickerItems(minCol, Array.from({length: MIN_OPTIONS+1}, (_,i)=>i), v=>String(v));
  buildPickerItems(secCol, SEC_OPTIONS, v=>String(v).padStart(2,'0'));

  function formatSetupTime(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2,'0');
  }

  function clampTotalSeconds(sec){
    return Math.max(MIN_SECONDS, Math.min(MAX_SECONDS, sec));
  }

  function getSelectedValue(col){
    const idx = Math.round(col.scrollTop / ITEM_H);
    const items = col.querySelectorAll('.picker-item');
    const clampedIdx = Math.max(0, Math.min(items.length-1, idx));
    return { idx: clampedIdx, value: Number(items[clampedIdx].dataset.value) };
  }

  function updateSelectedHighlight(col, selectedIdx){
    col.querySelectorAll('.picker-item').forEach((el, i)=>{
      el.classList.toggle('selected', i === selectedIdx);
    });
  }

  function recalcTotalFromPickers(){
    const m = getSelectedValue(minCol);
    const s = getSelectedValue(secCol);
    updateSelectedHighlight(minCol, m.idx);
    updateSelectedHighlight(secCol, s.idx);
    let total = m.value*60 + s.value;
    if(total < MIN_SECONDS) total = MIN_SECONDS;
    if(total > MAX_SECONDS) total = MAX_SECONDS;
    TOTAL_SECONDS = total;
    setupDisplay.textContent = formatSetupTime(TOTAL_SECONDS);
  }

  let scrollDebounce = {min:null, sec:null};
  function onColScroll(col, key){
    if(scrollDebounce[key]) clearTimeout(scrollDebounce[key]);
    scrollDebounce[key] = setTimeout(()=>{
      recalcTotalFromPickers();
    }, 80);
  }
  minCol.addEventListener('scroll', ()=>onColScroll(minCol,'min'));
  secCol.addEventListener('scroll', ()=>onColScroll(secCol,'sec'));

  function setPickerToSeconds(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    const minIdx = Math.max(0, Math.min(MIN_OPTIONS, m));
    const secIdx = Math.max(0, SEC_OPTIONS.indexOf(Math.round(s/10)*10));
    minCol.scrollTop = minIdx * ITEM_H;
    secCol.scrollTop = (secIdx < 0 ? 0 : secIdx) * ITEM_H;
    updateSelectedHighlight(minCol, minIdx);
    updateSelectedHighlight(secCol, secIdx < 0 ? 0 : secIdx);
  }

  // 初期表示 (5分0秒)
  setTimeout(()=>{ setPickerToSeconds(TOTAL_SECONDS); setupDisplay.textContent = formatSetupTime(TOTAL_SECONDS); }, 0);

  beginBtn.addEventListener('click', ()=>{
    TOTAL_BARS = TOTAL_SECONDS / SECONDS_PER_BAR;
    buildBars();
    setupPanel.classList.add('hidden');
    runPanel.classList.remove('hidden');
    resetTimerState();
  });

  changeTimeBtn.addEventListener('click', ()=>{
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    runPanel.classList.add('hidden');
    setupPanel.classList.remove('hidden');
    setTimeout(()=>setPickerToSeconds(TOTAL_SECONDS), 0);
  });

  // ---- 音 ----
  let audioUnlocked = false;

  function ensureAudioContext(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    if(!audioUnlocked){
      // iPad/iOSのstandalone表示で音が鳴らない対策:
      // ユーザー操作の中で必ず一度、無音バッファを実際に再生してオーディオ経路を開く
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      src.start(0);
      audioUnlocked = true;
    }
  }

  function playChime(){
    if(!audioCtx) return;
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    const now = audioCtx.currentTime;
    const ALARM_DURATION = 10; // 秒
    const INTERVAL = 1.2; // 音と音の間隔(秒)
    const count = Math.floor(ALARM_DURATION / INTERVAL);
    for(let i=0;i<count;i++){
      const t0 = now + i*INTERVAL;
      // 2音の優しいベル(ピンポン)を繰り返す
      [880, 660].forEach((freq, j)=>{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const tt = t0 + j*0.22;
        gain.gain.setValueAtTime(0, tt);
        gain.gain.linearRampToValueAtTime(0.35, tt + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, tt + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(tt);
        osc.stop(tt + 0.32);
      });
    }
  }

  // ---- バー生成 ----
  function buildBars(){
    barsEl.innerHTML = '';
    barEls = [];
    fillEls = [];
    for(let i=0;i<TOTAL_BARS;i++){
      const b = document.createElement('div');
      b.className = 'bar';
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      b.appendChild(fill);
      barsEl.appendChild(b);
      barEls.push(b);
      fillEls.push(fill);
    }
    const dbg = document.getElementById('debugInfo');
    if(dbg) dbg.textContent = 'DEBUG: TOTAL_BARS=' + TOTAL_BARS + ' / barEls.length=' + barEls.length + ' / barsEl.children=' + barsEl.children.length;
  }

  function formatTime(ms){
    const totalSec = Math.ceil(ms/1000);
    const m = Math.floor(totalSec/60);
    const s = totalSec % 60;
    return m + ':' + String(s).padStart(2,'0');
  }

  function setBarsState(remainingMs){
    const elapsedMs = TOTAL_SECONDS*1000 - remainingMs;
    const currentIndex = Math.floor(elapsedMs / (SECONDS_PER_BAR*1000));
    const msIntoCurrentBar = elapsedMs - currentIndex * SECONDS_PER_BAR * 1000;
    const currentFraction = Math.min(1, msIntoCurrentBar / (SECONDS_PER_BAR*1000));

    for(let i=0;i<TOTAL_BARS;i++){
      const bar = barEls[i];
      const fill = fillEls[i];
      if(i < currentIndex){
        bar.classList.add('off');
        fill.style.transform = 'scaleX(0)';
      } else if(i === currentIndex){
        bar.classList.remove('off');
        fill.style.transform = 'scaleX(' + (1-currentFraction) + ')';
      } else {
        bar.classList.remove('off');
        fill.style.transform = 'scaleX(1)';
      }
    }
    clockEl.textContent = formatTime(remainingMs);
    clockEl.classList.toggle('warn', remainingMs <= 30000 && remainingMs > 0);
    clockEl.classList.toggle('done', remainingMs <= 0);
  }

  function frame(now){
    if(!running) return;
    const elapsed = elapsedBeforePause + (now - startTimestamp);
    const remainingMs = Math.max(0, TOTAL_SECONDS*1000 - elapsed);
    setBarsState(remainingMs);
    if(remainingMs <= 0){
      finish();
      return;
    }
    rafId = requestAnimationFrame(frame);
  }

  function finish(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    setBarsState(0);
    startBtn.disabled = true;
    pauseBtn.disabled = true;
    subtextEl.textContent = '';
    doneOverlay.classList.add('show');
    playChime();
  }

  function start(){
    if(running) return;
    if(elapsedBeforePause >= TOTAL_SECONDS*1000) return;
    ensureAudioContext();
    running = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    subtextEl.textContent = 'がんばって まってね';
    doneOverlay.classList.remove('show');
    startTimestamp = performance.now();
    rafId = requestAnimationFrame(frame);
  }

  function pause(){
    if(!running) return;
    running = false;
    elapsedBeforePause += performance.now() - startTimestamp;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    subtextEl.textContent = 'とまっているよ';
  }

  function resetTimerState(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    elapsedBeforePause = 0;
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    subtextEl.textContent = 'スタートを おしてね';
    doneOverlay.classList.remove('show');
    setBarsState(TOTAL_SECONDS*1000);
  }

  doneOkBtn.addEventListener('click', ()=>{
    doneOverlay.classList.remove('show');
  });

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', resetTimerState);
})();
</script>

</body>
</html>
